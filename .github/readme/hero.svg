      <path d="M19 24Q109-5 179 39l-5 132Q106 135 8 164Z" fill="#fffaf0" opacity="0.8"/>
      <g fill="none" stroke="#ceb899" stroke-width="2.5" stroke-linecap="round" opacity="0.65">
