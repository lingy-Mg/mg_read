<?xml version="1.0" encoding="UTF-8"?>
<!-- README 专用品牌插画；静态、自包含，无外部字体或脚本，不作为应用 UI 截图。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">把喜欢的故事，留在身边。</title>
  <desc id="description">奶油色背景与暖橙色阳光，一本翻开的书串联阅读、聆听与观影的闲暇时光。</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff8ec"/><stop offset="1" stop-color="#f6e8d3"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ec9a51"/><stop offset="1" stop-color="#f7cf8d"/></linearGradient>
    <linearGradient id="cover" x2="0" y2="1"><stop stop-color="#b66037"/><stop offset="1" stop-color="#7d412c"/></linearGradient>
    <linearGradient id="pages" x2="0" y2="1"><stop stop-color="#fffef5"/><stop offset="1" stop-color="#f7e4c3"/></linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#8b5939" opacity="0.09"/></pattern>
    <clipPath id="edge"><rect width="1200" height="480" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
    <path fill="url(#paper)" d="M0 0h1200v480H0z"/>
    <path fill="url(#dots)" d="M0 0h1200v480H0z"/>
    <circle cx="1010" cy="170" r="260" fill="none" stroke="#dfc8a7" opacity="0.55"/>
    <circle cx="1010" cy="170" r="223" fill="none" stroke="#dfc8a7" opacity="0.4"/>
    <circle cx="950" cy="189" r="144" fill="url(#sun)"/>
    <path d="M676 355c121-44 170-17 267-26 89-9 157-43 257-23v174H676z" fill="#e8d4b4" opacity="0.48"/>
    <path d="M785 402c135-64 251-45 415-20v98H785z" fill="#d6bc96" opacity="0.24"/>
    <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
      <rect x="64" y="56" width="230" height="32" rx="16" fill="#f2dfc4"/>
      <circle cx="83" cy="72" r="4" fill="#b96935"/>
      <text x="98" y="78" font-size="12" font-weight="600" letter-spacing="1.5" fill="#885b3c">A LITTLE TIME FOR YOU</text>
      <text x="60" y="180" fill="#473326" font-size="64" font-weight="700" letter-spacing="-2">把喜欢的故事，</text>
      <text x="60" y="261" fill="#ac592e" font-size="64" font-weight="700" letter-spacing="-2">留在身边。</text>
      <path d="M65 285c83-7 180-7 274-2" fill="none" stroke="#d69b60" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="334" fill="#806b57" font-size="21">在文字里远行，在声音里停留。</text>
      <text x="64" y="366" fill="#806b57" font-size="21">让每一段闲暇，都有故事相伴。</text>
      <text x="64" y="435" fill="#9b7756" font-size="13" letter-spacing="4">READ. LISTEN. WATCH.</text>
      <text x="1140" y="435" text-anchor="end" fill="#947152" font-size="13" letter-spacing="2">YOUR STORIES, YOUR PACE.</text>
    </g>
    <!-- 纸页与书脊构成独立的阅读插画，不描绘尚未验证的产品界面。 -->
    <g transform="translate(724 172) rotate(-8 185 110)">
      <ellipse cx="186" cy="194" rx="195" ry="22" fill="#765239" opacity="0.12"/>
