        <path d="M218 65q48-22 105-11M217 84q50-21 108-10M216 103q51-20 111-10M215 122q51-19 114-10M214 141q34-14 68-13"/>
      </g>
      <path d="M294 20v79l-15-11-15 13V24q15-3 30-4" fill="#c87340"/>
      <path d="M3 177q103-25 182 15 81-40 184-16" fill="none" stroke="#fbefd9" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#9e6b43" stroke-width="2" stroke-linecap="round">
      <path d="M729 117v18m-9-9h18"/>
      <path d="M1118 243v14m-7-7h14"/>
      <path d="M1073 82q11-15 22-1M1095 81q11-15 22-1"/>
    </g>
    <circle cx="783" cy="84" r="4" fill="#c38b56"/>
    <circle cx="1141" cy="298" r="3" fill="#c38b56"/>
  </g>
</svg>
