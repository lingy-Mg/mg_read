name: Build verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

run-name: Build ${{ github.ref_name }} @ ${{ github.sha }}

# A burst of pushes should produce only one expensive build.
# A newer push cancels both queued and running builds for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.10.0"
  NPM_VERSION: "11.19.1"

jobs:
  debounce:
    name: Wait for push burst
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Debounce rapid pushes
        if: github.event_name == 'push'
        run: sleep 60

  android:
    name: Android release APK
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build Android Runtime assets
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run build

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub --dart-define=MGREAD_APPLICATION_ID_SUFFIX=ci${{ github.run_number }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: mgread-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows x64 release
    needs: debounce
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Windows Node Runtime from Git LFS
        shell: pwsh
        run: git lfs pull --include="packages/mg_read_node_runtime/tools/node-v26.10.0-win-x64/node.exe" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and stage Windows Runtime
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run stage:flutter-windows

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/mgread-windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: mgread-windows-x64-${{ github.sha }}
          path: build/mgread-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS arm64 release
    needs: debounce
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch macOS Node Runtime from Git LFS
        run: git lfs pull --include="packages/mg_read_node_runtime/tools/node-v26.10.0-darwin-arm64/bin/node" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and stage macOS Runtime
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run stage:flutter-macos

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --no-pub

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/MgRead.app" "build/mgread-macos-arm64.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: mgread-macos-arm64-${{ github.sha }}
          path: build/mgread-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Unable to read version from pubspec.yaml" >&2
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping publication."
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping publication to avoid replacing an existing version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mgread-android-${{ github.sha }}
          path: release/android

      - name: Download Windows artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mgread-windows-x64-${{ github.sha }}
          path: release/windows

      - name: Download macOS artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mgread-macos-arm64-${{ github.sha }}
          path: release/macos

      - name: Prepare release assets
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/final

          mv release/android/app-release.apk             "release/final/MgRead-${VERSION}-android-arm64.apk"
          mv release/windows/mgread-windows-x64.zip             "release/final/MgRead-${VERSION}-windows-x64.zip"
          mv release/macos/mgread-macos-arm64.zip             "release/final/MgRead-${VERSION}-macos-arm64.zip"

          (
            cd release/final
            sha256sum MgRead-* > SHA256SUMS.txt
          )

      - name: Publish stable release
        if: steps.existing.outputs.exists != 'true' && steps.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG"             release/final/*             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "MgRead v$VERSION"             --generate-notes             --latest

      - name: Publish prerelease
        if: steps.existing.outputs.exists != 'true' && steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG"             release/final/*             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "MgRead v$VERSION"             --generate-notes             --prerelease             --latest=false

