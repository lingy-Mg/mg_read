# Owns signed platform builds and versioned release assets. Android publishes
# ARM64 and a universal ARM64/x86_64 APK; Javet Node 6 does not ship ARMv7.
name: Build verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

run-name: Build ${{ github.ref_name }} @ ${{ github.sha }}

# A burst of pushes should produce only one expensive build.
# A newer push cancels both queued and running builds for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.10.0"
  NPM_VERSION: "11.19.1"

jobs:
  debounce:
    name: Wait for push burst
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Debounce rapid pushes
        if: github.event_name == 'push'
        run: sleep 60

  android:
    name: Android release APK
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Android Node Runtime from Git LFS
        run: git lfs pull --include="packages/mgread_plugin_runtime/android/src/main/jniLibs/arm64-v8a/libnode.so" --exclude=""

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''

      - name: Install Android NDK
        run: sdkmanager --sdk_root="$ANDROID_HOME" --install "ndk;$ANDROID_NDK_VERSION"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: x86_64-linux-android,aarch64-linux-android
          rustflags: ""

      - name: Build Android native Runtime
        shell: pwsh
        run: ./tools/build_native_runtime.ps1 -Platform android -NdkRoot "$env:ANDROID_HOME/ndk/$env:ANDROID_NDK_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build Android Runtime assets
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run build

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Install local Android signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.MGREAD_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]]; then
            echo "Missing repository secret MGREAD_ANDROID_DEBUG_KEYSTORE_BASE64." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/mgread-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "MGREAD_ANDROID_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          actual_sha256="$(keytool -list -v -keystore "$keystore_path" -storepass android -alias androiddebugkey | awk '/SHA256:/{gsub(/:/, "", $2); print tolower($2); exit}')"
          if [[ "$actual_sha256" != "498e9562618685462c6e9247018765a9d4220d21b4c402a209ba43dff3c752c9" ]]; then
            echo "Android signing certificate does not match the local release key." >&2
            exit 1
          fi

      - name: Build Android APK
        run: |
          flutter build apk --release --target-platform android-arm64 --no-pub
          mkdir -p build/android-release
          cp build/app/outputs/flutter-apk/app-release.apk build/android-release/app-arm64.apk

      - name: Build universal Android APK
        run: |
          flutter build apk --release --target-platform android-arm64,android-x64 --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk build/android-release/app-universal.apk

      - name: Verify packaged Android runtimes
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          for name, abis in {
              'arm64': {'arm64-v8a'},
              'universal': {'arm64-v8a', 'x86_64'},
          }.items():
              with ZipFile(Path('build/android-release') / f'app-{name}.apk') as apk:
                  libraries = {p for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')}
                  actual_abis = {p.split('/')[1] for p in libraries}
                  if actual_abis != abis:
                      raise RuntimeError(f'{name}: expected {abis}, found {actual_abis}')
                  for abi in abis:
                      for library in ('libflutter.so', 'libapp.so', 'libmgread_native_runtime.so'):
                          if f'lib/{abi}/{library}' not in libraries:
                              raise RuntimeError(f'{name}: missing {abi}/{library}')
                      if not any(p.startswith(f'lib/{abi}/libjavet') for p in libraries):
                          raise RuntimeError(f'{name}: missing Javet for {abi}')
                  if 'lib/arm64-v8a/libnode.so' not in libraries:
                      raise RuntimeError(f'{name}: missing ARM64 Node process runtime')

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: mgread-android-${{ github.sha }}
          path: build/android-release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows x64 release
    needs: debounce
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          rustflags: ""

      - name: Build native Runtime hosts
        shell: pwsh
        run: ./tools/build_native_runtime.ps1 -Platform windows

      - name: Fetch Windows Node Runtime from Git LFS
        shell: pwsh
        run: git lfs pull --include="packages/mg_read_node_runtime/tools/node-v26.10.0-win-x64/node.exe" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and stage Windows Runtime
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run stage:flutter-windows
          npm run verify:staged-windows

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/mgread-windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: mgread-windows-x64-${{ github.sha }}
          path: build/mgread-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS arm64 release
    needs: debounce
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch macOS Node Runtime from Git LFS
        run: git lfs pull --include="packages/mg_read_node_runtime/tools/node-v26.10.0-darwin-arm64/bin/node" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and stage macOS Runtime
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run stage:flutter-macos

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --no-pub

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/MgRead.app" "build/mgread-macos-arm64.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: mgread-macos-arm64-${{ github.sha }}
          path: build/mgread-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Unable to read version from pubspec.yaml" >&2
            exit 1
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping publication."
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists; skipping publication to avoid replacing an existing version."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: release_notes
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git describe --tags --match 'v[0-9]*' --exclude '*-*' --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)"
          python3 tools/generate_release_notes.py \
            --from-tag "$PREVIOUS_TAG" \
            --to-ref "$GITHUB_SHA" \
            --release-tag "$TAG" \
            --repository "$REPOSITORY" \
            --output release/release-notes.txt
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Download Android artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mgread-android-${{ github.sha }}
          path: release/android

      - name: Download Windows artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mgread-windows-x64-${{ github.sha }}
          path: release/windows

      - name: Download macOS artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          name: mgread-macos-arm64-${{ github.sha }}
          path: release/macos

      - name: Prepare release assets
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/final

          mv release/android/app-arm64.apk             "release/final/MgRead-${VERSION}-android-arm64.apk"
          mv release/android/app-universal.apk             "release/final/MgRead-${VERSION}-android-universal.apk"
          mv release/windows/mgread-windows-x64.zip             "release/final/MgRead-${VERSION}-windows-x64.zip"
          mv release/macos/mgread-macos-arm64.zip             "release/final/MgRead-${VERSION}-macos-arm64.zip"

          (
            cd release/final
            sha256sum MgRead-* > SHA256SUMS.txt
          )

      - name: Prepare Android update manifest
        if: steps.existing.outputs.exists != 'true' && steps.version.outputs.prerelease != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          PREVIOUS_TAG: ${{ steps.release_notes.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Stable Android update requires a version with a build number: $VERSION" >&2
            exit 1
          fi
          VERSION_NUMBER="${BASH_REMATCH[1]}"
          BUILD_NUMBER="${BASH_REMATCH[2]}"

          APK_NAME="MgRead-${VERSION}-android-universal.apk"
          APK_PATH="release/final/$APK_NAME"
          APK_SHA256="$(sha256sum "$APK_PATH" | cut -d ' ' -f 1)"
          APK_SIZE="$(stat -c '%s' "$APK_PATH")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMPARE_URL=""
          if [[ -n "$PREVIOUS_TAG" ]]; then
            COMPARE_URL="https://github.com/$REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
          fi

          jq -n \
            --arg schema 'mgread.android-update.v1' \
            --arg repository "$REPOSITORY" \
            --arg version "$VERSION_NUMBER" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --arg tag "$TAG" \
            --arg title "MgRead $TAG" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg targetCommitish "$COMMIT_SHA" \
            --arg commitSha "$COMMIT_SHA" \
            --arg compareUrl "$COMPARE_URL" \
            --rawfile releaseNotes release/release-notes.txt \
            --arg apkName "$APK_NAME" \
            --arg apkSha256 "$APK_SHA256" \
            --argjson apkSize "$APK_SIZE" \
            '{
              schema: $schema,
              repository: $repository,
              version: $version,
              buildNumber: $buildNumber,
              tag: $tag,
              title: $title,
              publishedAt: $publishedAt,
              targetCommitish: $targetCommitish,
              commitSha: $commitSha,
              compareUrl: (if $compareUrl == "" then null else $compareUrl end),
              releaseNotes: ($releaseNotes | sub("\\n$"; "")),
              apk: {name: $apkName, sha256: $apkSha256, size: $apkSize}
            }' > release/final/update.json

          (
            cd release/final
            sha256sum MgRead-* update.json > SHA256SUMS.txt
          )

      - name: Publish stable release
        if: steps.existing.outputs.exists != 'true' && steps.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" release/final/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MgRead v$VERSION" \
            --notes-file release/release-notes.txt \
            --latest

      - name: Publish prerelease
        if: steps.existing.outputs.exists != 'true' && steps.version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "$TAG" release/final/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "MgRead v$VERSION" \
            --notes-file release/release-notes.txt \
            --prerelease \
            --latest=false


