/**
 * MgRead Android Runtime library build configuration.
 *
 * Owns Android API and JVM compatibility for the Flutter-facing Runtime.
 * Kotlin Gradle Plugin remains required while the host keeps built-in Kotlin disabled.
 */
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'com.mgread.mgread_plugin_runtime'
version '1.0-SNAPSHOT'

android {
    namespace 'com.mgread.mgread_plugin_runtime'
    compileSdk 35

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.caoccao.javet:javet-node-android:5.0.8'
}
