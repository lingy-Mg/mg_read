plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

group 'com.mgread.mgread_plugin_runtime'
version '1.0-SNAPSHOT'

android {
    namespace 'com.mgread.mgread_plugin_runtime'
    compileSdk 35

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.caoccao.javet:javet-node-android:5.0.8'
}
