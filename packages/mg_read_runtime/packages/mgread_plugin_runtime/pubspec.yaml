name: mgread_plugin_runtime
description: MgRead Runtime-owned Flutter Facade for the bundled desktop Node Runtime.
publish_to: none
version: 0.5.0-standard.0

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

