name: mgread_plugin_runtime
description: MgRead Runtime-owned Flutter Facade for the bundled desktop Node Runtime.
publish_to: none
version: 0.4.2-standard.0

environment:
  sdk: ^3.12.2

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.mgread.mgread_plugin_runtime
        pluginClass: MgReadPluginRuntimePlugin
      windows:
        pluginClass: MgreadPluginRuntimePluginCApi
  assets:
    - assets/runtime/android/runtime-version.txt
    - assets/runtime/android/dist/
    - assets/runtime/windows-x64/node/
    - assets/runtime/windows-x64/dist/
