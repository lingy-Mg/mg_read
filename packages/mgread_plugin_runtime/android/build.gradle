/**
 * MgRead Android Runtime library build configuration.
 *
 * Owns Android API and JVM compatibility for the Flutter-facing Runtime.
 * Uses AGP 9 built-in Kotlin; the host must keep android.builtInKotlin enabled.
 */
import java.util.Base64

plugins {
    id 'com.android.library'
}

def encodedDartDefines = findProperty('dart-defines') ?: rootProject.findProperty('dart-defines')
def isNativeRuntimeBuild = false
def isNodeOnlyRuntimeBuild = false
if (encodedDartDefines instanceof String) {
    isNativeRuntimeBuild = encodedDartDefines.split(',').any { encoded ->
        try {
            new String(Base64.decoder.decode(encoded), 'UTF-8') == 'MGREAD_NATIVE_RUNTIME=true'
        } catch (IllegalArgumentException ignored) {
            false
        }
    }
    isNodeOnlyRuntimeBuild = encodedDartDefines.split(',').any { encoded ->
        try {
            new String(Base64.decoder.decode(encoded), 'UTF-8') == 'MGREAD_NODE_ONLY=true'
        } catch (IllegalArgumentException ignored) {
            false
        }
    }
}
def includesNativeRuntime = !isNodeOnlyRuntimeBuild

group = 'com.mgread.mgread_plugin_runtime'
version = '1.0-SNAPSHOT'

android {
    namespace = 'com.mgread.mgread_plugin_runtime'
    compileSdk = 35

    defaultConfig {
        minSdk = 24
    }

    flavorDimensions += 'mgreadRuntimeBackend'

    productFlavors {
        javet {
            dimension 'mgreadRuntimeBackend'
            consumerProguardFiles 'consumer-rules.pro'
        }
        nativeRuntime {
            dimension 'mgreadRuntimeBackend'
        }
        hybrid {
            dimension 'mgreadRuntimeBackend'
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    sourceSets {
        javet {
            kotlin.srcDirs += ['src/javetOnly/kotlin']
        }
        nativeRuntime {
            kotlin.srcDirs += ['src/nativeOnly/kotlin']
        }
        hybrid {
            kotlin.srcDirs += ['src/javet/kotlin', 'src/nativeRuntime/kotlin']
            jniLibs.srcDirs = ['src/native/jniLibs']
            jniLibs.excludes += ['**/libnode.so', '**/libmgread_node_bridge.so']
        }
    }

    if (!isNativeRuntimeBuild) {
        defaultConfig {
            externalNativeBuild {
                cmake {
                    arguments '-DANDROID_STL=c++_shared'
                }
            }
        }

        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
            }
        }
    }

    if (isNativeRuntimeBuild) {
        sourceSets {
            main {
                java.setSrcDirs([])
                jniLibs.setSrcDirs([])
            }
            test {
                java.setSrcDirs([])
            }
            nativeRuntime {
                kotlin.setSrcDirs(['src/nativeRuntime/kotlin'])
                jniLibs.srcDirs = ['src/native/jniLibs']
                jniLibs.excludes += ['**/libnode.so', '**/libmgread_node_bridge.so']
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Backend dependencies are variant-specific: nativeRuntime has neither
    // WebKit's legacy adapter nor Javet in its dependency graph.
    javetImplementation 'androidx.webkit:webkit:1.17.0'
    javetImplementation 'com.caoccao.javet:javet-node-android:6.0.1'
    hybridImplementation 'androidx.webkit:webkit:1.17.0'
    hybridImplementation 'com.caoccao.javet:javet-node-android:6.0.1'
    testImplementation 'junit:junit:4.13.2'
}

if (includesNativeRuntime) {
    def verifyNativeRuntimeLibraries = tasks.register('verifyNativeRuntimeLibraries') {
        doLast {
            ['arm64-v8a', 'x86_64'].each { abi ->
                if (!file("src/native/jniLibs/${abi}/libmgread_native_runtime.so").isFile()) {
                    throw new GradleException('Build the Rust hosts with tools/build_native_runtime.ps1 -Platform android before building the native app.')
                }
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn(verifyNativeRuntimeLibraries) }
}
