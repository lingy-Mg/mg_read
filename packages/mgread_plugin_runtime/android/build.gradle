/**
 * MgRead Android Runtime library build configuration.
 *
 * Owns Android API and JVM compatibility for the Flutter-facing Runtime.
 * Uses AGP 9 built-in Kotlin; the host must keep android.builtInKotlin enabled.
 */
plugins {
    id 'com.android.library'
}

group = 'com.mgread.mgread_plugin_runtime'
version = '1.0-SNAPSHOT'

android {
    namespace = 'com.mgread.mgread_plugin_runtime'
    compileSdk = 35

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'consumer-rules.pro'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'com.caoccao.javet:javet-node-android:6.0.1'
    testImplementation 'junit:junit:4.13.2'
}
