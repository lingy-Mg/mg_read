[package]
name = "mgread-native-sdk"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
mgread-native-abi = { path = "../abi" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
getrandom = "=0.4.3"
futures-util = "=0.3.34"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "socks", "system-proxy"] }
