name: mg_read
description: "Main Flutter application for MgRead."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: 17.3.0
  drift: 2.34.3
  path_provider: 2.1.6
  mgread_plugin_runtime:
    path: ../mg_read_runtime/packages/mgread_plugin_runtime
  novel_reader_ui:
    path: ../mg_read_reader_ui

dev_dependencies:
  build_runner: 2.15.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: 4.4.0

flutter:
  uses-material-design: true
