name: mg_read
description: "Main Flutter application for MgRead."
publish_to: 'none'
version: 0.9.119+237

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  cryptography: 2.9.0
  ffi: 2.2.0
  go_router: 17.3.0
  drift: 2.34.3
  file_selector: 1.1.0
  flutter_secure_storage: 10.2.0
  path_provider: 2.1.6
  package_info_plus: 10.2.1
  mobile_scanner:
    path: packages/mobile_scanner
  qr_flutter: 4.1.0
  share_plus: 13.3.0
  url_launcher: 6.3.2
  mgread_plugin_runtime:
    path: packages/mg_read_runtime/packages/mgread_plugin_runtime
  novel_reader_ui:
    path: packages/mg_read_reader_ui
  mg_read_audio_player:
    path: packages/mg_read_audio_player
  mg_read_video_player:
    path: packages/mg_read_video_player
  # Video native libraries include audio support and package Windows libmpv.
  # Do not add media_kit_libs_audio alongside this package.
  media_kit_libs_video: 1.0.7
  audio_service: 0.18.19
  audio_session: 0.2.4
  socks5_proxy: 2.1.1

dev_dependencies:
  build_runner: 2.15.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: 4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mg_read_logo.png
    - assets/data_sources/aisishuwu.webp
    - assets/data_sources/shudugu.webp
    - assets/profile/profile-traveler-avatar.webp
    - assets/illustrations/library_empty_updates.png
    - assets/illustrations/home/
    - assets/illustrations/page_backdrops/
    - assets/fixtures/home_covers/
