name: mg_read
description: "Main Flutter application for MgRead."
publish_to: 'none'
version: 0.5.0+82

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: 17.3.0
  drift: 2.34.3
  path_provider: 2.1.6
  mobile_scanner: 7.4.0
  qr_flutter: 4.1.0
  url_launcher: 6.3.2
  mgread_plugin_runtime:
    path: packages/mg_read_runtime/packages/mgread_plugin_runtime
  novel_reader_ui:
    path: packages/mg_read_reader_ui

dev_dependencies:
  build_runner: 2.15.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router_builder: 4.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mg_read_logo.png
    - assets/profile/profile-traveler-avatar.png
    - assets/illustrations/library_first_run_books.png
    - assets/illustrations/library_first_run_books_v2.png
    - assets/illustrations/library_empty_updates.png
    - assets/illustrations/home/
    - assets/illustrations/page_backdrops/
    - assets/fixtures/home_covers/
