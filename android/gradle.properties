# =========================
# Gradle JVM 配置
# =========================

# Gradle 最大堆内存。
# 你的机器内存足够，8G 完全可以保留。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8


# =========================
# Gradle 构建性能优化
# =========================

# 开启并行构建。
# Flutter 项目包含 app、Flutter 插件等多个 Gradle module 时可以并行处理。
org.gradle.parallel=true

# 开启 Gradle Build Cache。
# 如果某个任务以前已经构建过，并且输入没有变化，可以直接复用之前的输出。
# 对重复 Debug / Release 构建很有帮助。
org.gradle.caching=true


# =========================
# Android 配置
# =========================

# 使用 AndroidX。
# Flutter 现代项目必须保留。
android.useAndroidX=true


# =========================
# Flutter / AGP 9 配置
# =========================

# Flutter 模板自动加入的 AGP 新 DSL 兼容开关。
# 当前先保持 false，不要为了加速修改它。
android.newDsl=false

# `audio_service` 仍应用旧 KGP；Flutter 3.44 的兼容模式会在 AGP 9
# 下保留它，待所有依赖完成内置 Kotlin 迁移后才能改回 true。
android.builtInKotlin=false
